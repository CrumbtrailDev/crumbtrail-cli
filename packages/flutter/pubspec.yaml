name: crumbtrail_flutter
description: Flutter SDK for Crumbtrail. Captures errors, network, navigation and app lifecycle around a bug, in the form a coding agent can act on.
version: 0.1.0
homepage: https://crumbtrail.ai
repository: https://github.com/CrumbtrailDev/crumbtrail-cli
issue_tracker: https://github.com/CrumbtrailDev/crumbtrail-cli/issues

environment:
  sdk: ^3.5.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  http: ^1.2.0
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: ai.crumbtrail.flutter
        pluginClass: CrumbtrailFlutterPlugin
      ios:
        pluginClass: CrumbtrailFlutterPlugin
