name: release

# Publishes public packages selected from changed package paths plus workspace
# dependency propagation since the supplied base ref. The release runner packs
# the entire set first, then skips only registry artifacts with matching SRI.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only; do not publish"
        type: boolean
        default: true
      base_ref:
        description: "Required git ref for the release baseline (normally the prior release commit or tag)"
        required: true
        type: string
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC id-token pnpm exchanges for a short-lived publish token
      # (npm trusted publishing) — and the same token backs provenance. There is
      # deliberately NO npm token here: 2FA-bypass tokens lose publish rights in
      # early 2027, and every package is registered as a trusted publisher of
      # THIS workflow file (release.yml). Renaming this file breaks publishing
      # until the trusted-publisher config on npmjs.com is renamed to match.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          # >=11.10 speaks OIDC. Pinned exactly: 11.13.0 is also the release that
          # stopped an unresolved ${NODE_AUTH_TOKEN} placeholder in the .npmrc
          # setup-node writes from being sent as a literal bearer token, which
          # 404s the OIDC publish.
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # build first: workspace typecheck resolves sibling packages' dist types.
      - run: pnpm build
      - run: pnpm verify:sdk-version-floors
      - run: pnpm verify:fresh-install
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:release

      - name: Create release plan and publish selected packages
        # pnpm pack creates actual .tgz artifacts and rewrites workspace:^ specs.
        # pnpm publish is required for the same workspace-protocol correctness.
        run: |
          if [ "$RELEASE_DRY_RUN" = "true" ]; then
            pnpm release:plan -- --base-ref "$RELEASE_BASE_REF" --mode dry-run
          else
            pnpm release:plan -- --base-ref "$RELEASE_BASE_REF" --mode publish
          fi
        env:
          NPM_CONFIG_PROVENANCE: true
          RELEASE_BASE_REF: ${{ inputs.base_ref }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
      - name: Upload dry-run package artifacts
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-dry-run
          path: .release-artifacts/
          # `.release-artifacts` is a DOT directory, and upload-artifact excludes
          # hidden paths by default, so every dry run packed its tarballs
          # correctly and then failed here with "No files were found". That made
          # the dry run unusable for the one thing it exists for: inspecting what
          # a release would publish, before publishing it. A real publish never
          # hit this, being gated on `if: inputs.dry_run`, which is how it went
          # unnoticed.
          include-hidden-files: true
          if-no-files-found: error

  publish-crate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Same trusted-publishing model as npm above: crates.io exchanges the OIDC
      # id-token for a short-lived publish token, so there is deliberately NO
      # CARGO_REGISTRY_TOKEN secret. The crate must be configured on crates.io
      # (tauri-plugin-crumbtrail → Settings → Trusted Publishing) with this repo
      # and workflow file (release.yml); renaming this file breaks crate
      # publishing until that config is renamed to match.
      id-token: write
    defaults:
      run:
        working-directory: packages/tauri/rust
    steps:
      - uses: actions/checkout@v4
      # Tauri's Linux backend compiles against GTK/WebKitGTK system libraries.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test
      - name: Skip if version already published
        id: check
        run: |
          VERSION=$(cargo pkgid | sed 's/.*[#@]//')
          if curl -s https://index.crates.io/ta/ur/tauri-plugin-crumbtrail | grep -q "\"vers\":\"$VERSION\""; then
            echo "tauri-plugin-crumbtrail $VERSION is already on crates.io; skipping publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: ${{ !inputs.dry_run && steps.check.outputs.published == 'false' }}
        id: auth
      - name: Publish
        if: ${{ steps.check.outputs.published == 'false' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish --dry-run
          else
            cargo publish
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # ---------------------------------------------------------------------------
  # Native SDK registries.
  #
  # These publish on their own version lines, not the npm one: every native SDK
  # sits at 0.1.0 while npm is in the 0.52.x range. Each job therefore reads its
  # own version from its own manifest and skips itself when that version is
  # already on the registry, so a dispatch that only moved npm is a no-op here
  # rather than an error. `base_ref` does not select these; the version check
  # does.
  # ---------------------------------------------------------------------------

  publish-pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Same trusted-publishing model as npm and crates.io: PyPI exchanges the
      # OIDC id-token for a short-lived publish token, so there is deliberately
      # NO PyPI API token secret. crumbtrail-python must be configured on
      # pypi.org (Manage → Publishing) with this repo and this workflow
      # filename; renaming release.yml breaks it until that config matches.
      id-token: write
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]" twine
      - run: python -m pytest
      - name: Skip if version already published
        id: check
        run: |
          VERSION=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sf -o /dev/null "https://pypi.org/pypi/crumbtrail-python/$VERSION/json"; then
            echo "crumbtrail-python $VERSION is already on PyPI; skipping publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build sdist and wheel
        if: ${{ steps.check.outputs.published == 'false' }}
        run: |
          rm -rf dist
          python -m build
          python -m twine check dist/*
      - name: Publish
        # packages-dir is repo-relative: an action does not inherit
        # defaults.run.working-directory, only `run:` steps do.
        if: ${{ !inputs.dry_run && steps.check.outputs.published == 'false' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
          skip-existing: true

  publish-gem:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # RubyGems trusted publishing, so no GEM_HOST_API_KEY secret. The gem must
      # be configured on rubygems.org (crumbtrail → Trusted publishers) with
      # this repo and this workflow filename.
      id-token: write
    defaults:
      run:
        working-directory: packages/ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          # The gemspec floor is >= 3.2. Anything older cannot even load the
          # library, which is how a local run once silently tested nothing.
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: packages/ruby
      - run: bundle exec ruby -Ilib -Itest -e 'Dir.glob("test/*_test.rb").sort.each { |f| require File.expand_path(f) }'
      - name: Skip if version already published
        id: check
        run: |
          VERSION=$(ruby -e "puts Gem::Specification.load('crumbtrail.gemspec').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sf -o /dev/null "https://rubygems.org/api/v2/rubygems/crumbtrail/versions/$VERSION.json"; then
            echo "crumbtrail $VERSION is already on RubyGems; skipping publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build gem
        if: ${{ steps.check.outputs.published == 'false' }}
        run: gem build crumbtrail.gemspec
      # Pinned exactly: this action publishes no floating major tag, so `@v1`
      # does not resolve and the job fails before any step runs.
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
        if: ${{ !inputs.dry_run && steps.check.outputs.published == 'false' }}
      - name: Publish
        if: ${{ !inputs.dry_run && steps.check.outputs.published == 'false' }}
        run: gem push "crumbtrail-${{ steps.check.outputs.version }}.gem"

  publish-nuget:
    runs-on: ubuntu-latest
    # The trusted publishing policy on nuget.org is scoped to the `production`
    # environment, so the OIDC token must carry it or the exchange is rejected.
    environment: production
    permissions:
      contents: read
      # nuget.org runs trusted publishing too, so this job stores no credential
      # either: NuGet/login exchanges the OIDC token for an API key that lives
      # one hour. The policy is registered against this repo and `release.yml`,
      # so renaming this file breaks NuGet along with npm, crates.io, PyPI and
      # RubyGems.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet test packages/dotnet/Crumbtrail.AspNetCore.Tests
      - run: dotnet test packages/dotnet/Crumbtrail.EntityFrameworkCore.Tests
      - name: Pack
        # -p:PackageOutputPath rather than -o, and an absolute path rather than a
        # relative one. The SDK on the runner mangles `-o` into a bare
        # `PackageOutputPath=...` argument, which MSBuild then reads as a second
        # project and rejects with MSB1008. The property form is unambiguous on
        # every SDK, and absolute keeps both projects writing to one directory
        # instead of one beside each .csproj.
        run: |
          dotnet pack packages/dotnet/Crumbtrail.AspNetCore \
            -p:PackageOutputPath="$GITHUB_WORKSPACE/.local-packs/dotnet"
          dotnet pack packages/dotnet/Crumbtrail.EntityFrameworkCore \
            -p:PackageOutputPath="$GITHUB_WORKSPACE/.local-packs/dotnet"
      # Deliberately the last thing before the push: the temporary key expires
      # after an hour, and each OIDC token buys exactly one key, so requesting
      # it earlier only risks it going stale mid-run.
      - name: NuGet login
        if: ${{ !inputs.dry_run }}
        id: login
        uses: NuGet/login@v1
        with:
          # The nuget.org profile name that owns the packages, not an email.
          user: crumbtrail
      - name: Publish
        # --skip-duplicate is the version check: NuGet answers 409 for an id and
        # version that already exist, and the flag turns that into a success
        # instead of failing the whole release.
        if: ${{ !inputs.dry_run }}
        run: |
          dotnet nuget push ".local-packs/dotnet/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

  tag-go:
    runs-on: ubuntu-latest
    permissions:
      # No registry and no credential: the Go module proxy serves whatever the
      # tag points at, so pushing the tag IS the publish.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/go/go.mod
      - run: go test ./...
        working-directory: packages/go
      - name: Tag the module
        run: |
          # capture.go's Version constant is the source of truth, because it is
          # also what the SDK reports over the wire. Tagging from anywhere else
          # lets the published module disagree with the events it sends.
          VERSION=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' packages/go/capture.go)
          if [ -z "$VERSION" ]; then
            echo "Could not read const Version from packages/go/capture.go" >&2
            exit 1
          fi
          # The directory prefix is mandatory for a module in a subdirectory. A
          # bare vX.Y.Z tag publishes nothing and cannot be corrected later: the
          # proxy caches tags immutably, so a wrong one is fixed by bumping the
          # patch, never by moving the tag.
          TAG="packages/go/v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; skipping."
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: would tag $TAG at $GITHUB_SHA"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Tagged $TAG"
          fi
