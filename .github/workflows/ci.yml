name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Matches release.yml and the lockfiles: pnpm 11 reads
          # patchedDependencies from pnpm-workspace.yaml, pnpm 10 does not, so a
          # 10 here fails --frozen-lockfile against the companion repo.
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build first: workspace typecheck resolves sibling packages' dist types.
      - run: pnpm build
      - name: Verify installer SDK version floors
        run: pnpm verify:sdk-version-floors
      - name: Verify packed CLI installation contract
        run: pnpm verify:fresh-install
      - name: Check generated topology and benchmark artifacts
        run: |
          pnpm --filter crumbtrail-topology-harness check:matrix
          pnpm --filter crumbtrail-topology-harness benchmark:check
          pnpm --filter crumbtrail-topology-harness generate
          pnpm --filter crumbtrail-topology-harness benchmark:report
      - name: Upload topology and benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: topology_and_benchmark
          path: |
            packages/topology-harness/matrix.generated.json
            packages/topology-harness/benchmark/report.generated.md
      - run: pnpm typecheck
      - run: pnpm test
      # `pnpm test` is `pnpm -r test`, which only reaches workspace packages.
      # scripts/ is not one, so the dev harness gates need their own run.
      - run: pnpm test:dev-harness
      # plugins/ is not a workspace package either. This suite validates every
      # SKILL.md against the live MCP tool table, so a skill naming a tool or a
      # parameter that does not exist fails CI rather than an agent's turn.
      - run: pnpm test:plugins

      # Dogfood the pre-deploy gate mechanism: the locally-built CLI must exit
      # NON-zero when the config is broken, which is what makes `.github/actions/verify`
      # fail a consumer's job. Hermetic — `.invalid` is RFC 6761-reserved and never
      # resolves, so DNS fails offline with no network dependency.
      - name: Verify gate fails on broken config
        run: |
          if node packages/cli/dist/cli.cjs verify \
            --endpoint https://this-host-does-not-exist.invalid --key x --json; then
            echo "::error::verify unexpectedly succeeded against a bogus endpoint — the CI gate is broken"
            exit 1
          fi
          echo "verify correctly exited non-zero on a broken config"

  # Mirror of crumbtrail's relaunch-gate job, pointed at THIS commit. The gate
  # reads this repo's evidence (topology matrix, correlation and topology
  # sources, package manifests) out of git objects at a pinned revision, so a
  # change here that breaks the cross repository contract fails this repo's CI
  # rather than surfacing later in crumbtrail.
  relaunch-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: crumbtrail-cli
          # The gate pins a revision and reads objects at it, so this checkout
          # needs real history rather than a single shallow commit.
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: CrumbtrailDev/crumbtrail
          path: crumbtrail
          token: ${{ secrets.COMPANION_REPO_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          # Matches release.yml and the lockfiles: pnpm 11 reads
          # patchedDependencies from pnpm-workspace.yaml, pnpm 10 does not, so a
          # 10 here fails --frozen-lockfile against the companion repo.
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: crumbtrail/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: crumbtrail
      # The gate runs companion test files via `pnpm exec vitest run <file>`,
      # which bypasses crumbtrail's root `pretest` hook that builds the internal
      # workspace libraries. The gate's rows run packages/cloud tests, which
      # import crumbtrail-capture-policy, crumbtrail-artifact-protocol, and
      # @crumbtrail-landing/shared at transform time. Each resolves via a
      # gitignored `dist/` that a clean checkout does not have, so without a
      # build every cloud row fails to collect and the gate reports a bare
      # "Test run exited 1" that looks like a real product regression. Build
      # cloud's whole dependency closure rather than a hand-listed subset that
      # silently drifts as new transform-time deps are added, plus the design
      # system that the dashboard and landing rows import.
      - name: Build the companion workspace libraries the gate's tests import
        working-directory: crumbtrail
        run: pnpm --filter "crumbtrail-cloud^..." --filter crumbtrail-design-system build
      - name: Resolve this checkout's commit
        id: companion
        run: echo "sha=$(git -C crumbtrail-cli rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Contract matches crumbtrail's gate job: HOLD is the honest verdict while
      # operational evidence stays pending, so READY is not required. What is
      # required is that every row resolves against this commit and no row is
      # FAIL or UNRESOLVED_CROSS_REPO.
      - name: Run the crumbtrail relaunch gate against this commit
        working-directory: crumbtrail
        env:
          CRUMBTRAIL_CLI_DIR: ${{ github.workspace }}/crumbtrail-cli
          CRUMBTRAIL_CLI_REV: ${{ steps.companion.outputs.sha }}
        run: |
          # --silent keeps pnpm's lifecycle banner out of stdout so the JSON
          # parses. Strict exits 1 on HOLD, hence the `|| true`; the assertion
          # below decides whether this job passes.
          pnpm --silent verify:relaunch-gate:strict --json > gate.json || true
          cat gate.json
          node --input-type=module -e '
            import fs from "node:fs";
            const result = JSON.parse(fs.readFileSync("gate.json", "utf8"));
            const broken = result.rows.filter((row) =>
              row.status === "FAIL" || row.status === "UNRESOLVED_CROSS_REPO",
            );
            for (const row of broken)
              console.log(`::error::row ${row.row} is ${row.status}`);
            if (!result.companionSha)
              console.log("::error::the companion revision did not resolve");
            if (!["READY", "HOLD"].includes(result.verdict))
              console.log(`::error::unexpected verdict ${result.verdict}`);
            const failed =
              broken.length > 0 ||
              !result.companionSha ||
              !["READY", "HOLD"].includes(result.verdict);
            console.log(
              `relaunch gate verdict=${result.verdict} companion=${result.companionSha}`,
            );
            process.exit(failed ? 1 : 0);
          '

  # ── Native SDK conformance suites ────────────────────────────────────────
  # packages/swift, packages/kotlin and packages/flutter each ship a wire
  # contract suite that asserts the same envelope shape as the JS SDKs. Those
  # suites are the only thing preventing the four languages drifting apart, so
  # they run as first-class jobs. Deliberately no `|| true` and no
  # `continue-on-error`: a suite that cannot run has to fail the job, because a
  # green check that proves nothing is worse than no check at all.
  # scripts/dev-harness/ci-workflow.test.mjs enforces exactly that.

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # macOS rather than Linux: Package.swift declares `.macOS(.v10_15)`, so
      # the contract, session, queue and redaction layers build here, while the
      # UIKit collectors compile out under their existing
      # `#if canImport(UIKit) && !os(macOS)` guards.
      - run: swift test --package-path packages/swift

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches `jvmToolchain(21)` in packages/kotlin/build.gradle.kts.
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          # packages/kotlin has NO Gradle wrapper — only build.gradle.kts and
          # settings.gradle.kts — so the version has to be pinned here.
          gradle-version: "9.7.0"
      # ANDROID_HOME is unset on this runner and no android.jar is present, so
      # build.gradle.kts takes its documented fallback branch: it excludes
      # `**/android/**` from the main source set and builds everything else.
      # This job therefore covers the contract, session, transport, queue and
      # redaction layers — it does NOT compile or test the Android bindings.
      # Do not read a green check here as Android coverage.
      - run: gradle test
        working-directory: packages/kotlin

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: packages/flutter
      - run: flutter test
        working-directory: packages/flutter
